[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-template"
version = "0.1.0"
description = "FastAPI server template with a CLI scaffolder."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pserialization",
    "argon2-cffi",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.13", "pymongo_inmemory"]
postgres = ["psycopg[binary]"]
sqlite = ["aiosqlite"]
db = ["pymongo>=4.13", "pymongo_inmemory", "psycopg[binary]", "aiosqlite"]
test = ["pytest", "pytest-xdist", "httpx", "argon2-cffi", "pymongo>=4.13", "pymongo_inmemory", "psycopg[binary]", "aiosqlite"]
quality = ["mypy", "ruff"]

[project.scripts]
server-template = "server_template.cli:main"
server-scaffold = "server_template.cli:main"

[tool.setuptools.packages.find]
include = ["server_template*"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
norecursedirs = ["test-scafold", "test-scafold/app"]

[tool.mypy]
python_version = "3.14"
packages = [
    "api",
    "auth",
    "persistence",
    "models",
    "service",
    "users",
    "server_template",
]
mypy_path = "server"
strict = true
ignore_missing_imports = true
exclude = "^(tests|test-scafold/tests)(/|$)"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["test-scafold/app"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W292"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "auth",
    "config",
    "db",
    "models",
    "service",
    "users",
    "server_template",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-between-types = 1
lines-after-imports = 2
