name: Scaffold API tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.python.outputs.python-version }}
      cache-key: ${{ steps.key.outputs.key }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compute virtualenv cache key
        id: key
        run: echo "key=venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}" >> "$GITHUB_OUTPUT"

      # Saved at the end of this job, before the jobs that need it start
      - name: Restore virtualenv
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: ${{ steps.key.outputs.key }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/python -m pip install --upgrade pip
          ~/venv/bin/python -m pip install -e ".[test,quality]" -r requirements.txt

  quality:
    name: Type and lint checks
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        uses: ./.github/actions/restore-venv
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Run mypy
        run: python -m mypy

      - name: Run Ruff
        run: python -m ruff check server server_template tests test-scafold/tests scripts

      - name: Check file edge formatting
        run: python scripts/format_file_edges.py --check server server_template tests test-scafold/tests scripts

  unit-tests:
    name: Unit tests
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        uses: ./.github/actions/restore-venv
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Run unit tests
        run: python -m pytest tests -q

  api-tests:
    name: API tests (${{ matrix.backend }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: mongo
            uri: "memory://"
          - backend: sqlite
            uri: "sqlite:///:memory:"
          - backend: postgres
            uri: "postgresql://postgres:postgres@localhost:5432/scaffold_api_tests"

    env:
      TEST_SCAFOLD_APP_ROOT: ${{ github.workspace }}/test-scafold/app
      APP_DB_BACKEND: ${{ matrix.backend }}
      APP_DB_URI: ${{ matrix.uri }}
      APP_DB_NAME: scaffold_api_tests
      PYTHONPATH: "${{ github.workspace }}/test-scafold/app/server:${{ github.workspace }}/test-scafold/app"
      PYMONGOIM__MONGO_VERSION: "8.0"
      PYMONGOIM__OPERATING_SYSTEM: ubuntu
      PYMONGOIM__OS_VERSION: "24"
      # Keep the mongod archive out of the shared virtualenv so only this job carries it
      PYMONGOIM__DOWNLOAD_FOLDER: ${{ github.workspace }}/.pymongoim

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        uses: ./.github/actions/restore-venv
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache-key: ${{ needs.setup.outputs.cache-key }}

      # Keyed on the virtualenv too, since a new pymongo_inmemory can resolve a different archive
      - name: Cache mongod download
        if: matrix.backend == 'mongo'
        uses: actions/cache@v4
        with:
          path: ${{ env.PYMONGOIM__DOWNLOAD_FOLDER }}
          key: mongod-${{ env.PYMONGOIM__OPERATING_SYSTEM }}${{ env.PYMONGOIM__OS_VERSION }}-${{ env.PYMONGOIM__MONGO_VERSION }}-${{ needs.setup.outputs.cache-key }}

      - name: Start Postgres
        if: matrix.backend == 'postgres'
        run: |
          docker run --detach \
            --name scaffold-postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=scaffold_api_tests \
            --publish 5432:5432 \
            postgres:16

          for attempt in {1..30}; do
            if docker exec scaffold-postgres pg_isready \
              --username postgres \
              --dbname scaffold_api_tests; then
              exit 0
            fi
            sleep 1
          done

          docker logs scaffold-postgres
          exit 1

      - name: Generate scaffold app with CLI
        run: |
          rm -rf test-scafold/app test-scafold/artifacts
          server-template new test-scafold-app \
            --target-dir test-scafold/app \
            --repo "file://${GITHUB_WORKSPACE}" \
            --branch "" \
            --force

      - name: Package generated scaffold app
        if: always()
        run: |
          mkdir -p "test-scafold/artifacts/generated-scaffold-app-${{ matrix.backend }}"
          cp -R test-scafold/app "test-scafold/artifacts/generated-scaffold-app-${{ matrix.backend }}/app"

      - name: Upload generated scaffold app
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-scaffold-app-${{ matrix.backend }}
          path: test-scafold/artifacts/generated-scaffold-app-${{ matrix.backend }}
          if-no-files-found: error

      # --no-index fails instead of downloading if the generated app needs anything the shared
      # virtualenv doesn't have
      - name: Check scaffold dependencies are installed
        run: python -m pip install --no-index -r test-scafold/app/requirements.txt

      - name: Run scaffold API tests
        run: python -m pytest test-scafold/tests -q
