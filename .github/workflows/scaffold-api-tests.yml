name: Scaffold API tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Type and lint checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[quality]"

      - name: Run mypy
        run: python -m mypy

      - name: Run Ruff
        run: python -m ruff check server server_template tests test-scafold/tests scripts

      - name: Check file edge formatting
        run: python scripts/format_file_edges.py --check server server_template tests test-scafold/tests scripts

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run unit tests
        run: python -m pytest tests -q

  api-tests:
    name: API tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: mongo
            uri: "memory://"
          - backend: sqlite
            uri: "sqlite:///:memory:"
          - backend: postgres
            uri: "postgresql://postgres:postgres@localhost:5432/scaffold_api_tests"

    env:
      TEST_SCAFOLD_APP_ROOT: ${{ github.workspace }}/test-scafold/app
      APP_DB_BACKEND: ${{ matrix.backend }}
      APP_DB_URI: ${{ matrix.uri }}
      APP_DB_NAME: scaffold_api_tests
      PYTHONPATH: "${{ github.workspace }}/test-scafold/app/server:${{ github.workspace }}/test-scafold/app"
      PYMONGOIM__MONGO_VERSION: "8.0"
      PYMONGOIM__OPERATING_SYSTEM: ubuntu
      PYMONGOIM__OS_VERSION: "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Start Postgres
        if: matrix.backend == 'postgres'
        run: |
          docker run --detach \
            --name scaffold-postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=scaffold_api_tests \
            --publish 5432:5432 \
            postgres:16

          for attempt in {1..30}; do
            if docker exec scaffold-postgres pg_isready \
              --username postgres \
              --dbname scaffold_api_tests; then
              exit 0
            fi
            sleep 1
          done

          docker logs scaffold-postgres
          exit 1

      - name: Install template CLI and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Generate scaffold app with CLI
        run: |
          rm -rf test-scafold/app test-scafold/artifacts
          server-template new test-scafold-app \
            --target-dir test-scafold/app \
            --repo "file://${GITHUB_WORKSPACE}" \
            --branch "" \
            --force

      - name: Package generated scaffold app
        if: always()
        run: |
          mkdir -p "test-scafold/artifacts/generated-scaffold-app-${{ matrix.backend }}"
          cp -R test-scafold/app "test-scafold/artifacts/generated-scaffold-app-${{ matrix.backend }}/app"

      - name: Upload generated scaffold app
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-scaffold-app-${{ matrix.backend }}
          path: test-scafold/artifacts/generated-scaffold-app-${{ matrix.backend }}
          if-no-files-found: error

      - name: Install scaffold dependencies
        run: |
          python -m pip install -r test-scafold/app/requirements.txt
          python -m pip install pytest httpx "pymongo>=4.13" pymongo_inmemory "psycopg[binary]" aiosqlite

      - name: Run scaffold API tests
        run: python -m pytest test-scafold/tests -q
